project_id = "forgefit"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/**", "http://localhost:3000/**"]
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# Email templates (local). The hosted project uses the same files, pasted into
# Authentication -> Emails -> Templates; see "Email" in README.md.
[auth.email.template.confirmation]
subject = "Confirm your ForgeFit email"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your ForgeFit password"
content_path = "./supabase/templates/recovery.html"
