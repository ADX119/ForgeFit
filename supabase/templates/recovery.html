<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background:#09090b;font-family:Arial,Helvetica,sans-serif;color:#f4f4f5;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#09090b;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#111113;border:1px solid #27272a;border-radius:16px;padding:32px;">
            <tr>
              <td>
                <p style="margin:0 0 24px;font-size:18px;font-weight:bold;color:#bef264;">ForgeFit</p>
                <h1 style="margin:0 0 12px;font-size:22px;color:#f4f4f5;">Reset your password</h1>
                <p style="margin:0 0 24px;font-size:15px;line-height:22px;color:#d4d4d8;">
                  Tap the button to choose a new password. The link works once and expires soon.
                </p>
                <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=recovery&amp;next=/update-password"
                   style="display:inline-block;background:#bef264;color:#09090b;font-weight:bold;font-size:15px;text-decoration:none;padding:12px 20px;border-radius:12px;">
                  Choose a new password
                </a>
                <p style="margin:24px 0 0;font-size:13px;line-height:20px;color:#a1a1aa;">
                  If you didn't ask to reset your password, you can ignore this email. Your password stays the same.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
